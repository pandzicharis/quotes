<!doctype html>
<html lang="bs" data-tema="tamna">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1711">
<title>Grafike · Poruka dana</title>
<!--
  Grafike za mreže, spremne za preuzimanje. Slike pravi scripts/promo.sh iz
  public/_promo/ — ovdje se samo prikazuju. Putanje su apsolutne jer se
  stranica otvara i kao /grafike i kao /grafike/.
-->
<link rel="icon" href="/assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap">
<script>
  // izabrana verzija vodi i temu stranice — zelena = noćna, bijela = dnevna, kao u aplikaciji
  try { if (localStorage.getItem('pd.grafike') === 'bijela') document.documentElement.dataset.tema = 'svijetla'; } catch {}
</script>
<!-- boje, slova i ambijent su iz aplikacije -->
<link rel="stylesheet" href="/css/app.css">
<style>
  body { padding: max(28px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom)); }
  main { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; }

  header { text-align: center; margin: 12px 0 30px; }
  header img { width: 64px; height: 64px; margin: 0 auto; }
  .nad { margin-top: 14px; font-size: 10.5px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
  h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 7vw, 42px); line-height: 1.1; margin: 8px 0 0; }
  header p { max-width: 460px; margin: 12px auto 0; font-size: 14px; line-height: 1.6; color: var(--ink-soft); }

  .izbor {
    display: inline-flex; gap: 4px; padding: 4px; margin-top: 22px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface);
  }
  .izbor button {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border: 0; border-radius: 999px;
    background: none; color: var(--ink-soft); font: 600 11px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase;
    cursor: pointer; transition: background .18s, color .18s;
  }
  .izbor button i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
  .izbor button[aria-pressed="true"] { background: linear-gradient(135deg, var(--brand-gold-l), var(--brand-gold)); color: #11221A; }

  /* Obje kartice iste visine: slike su iste visine (širina ide za omjerom),
     a dno kartice je isto složeno — naziv, pa red dugmadi. */
  .mreza { display: flex; justify-content: center; align-items: stretch; gap: 18px; }
  .karta { display: flex; flex-direction: column; }
  .karta img { height: min(66vh, 620px); width: auto; }
  @media (max-width: 560px) {
    .mreza { flex-direction: column; gap: 26px; }
    .karta img { height: auto; width: 100%; }
  }

  .karta {
    border: 1px solid var(--line); border-radius: 20px; padding: 12px;
    background: linear-gradient(170deg, color-mix(in srgb, var(--gold) 8%, var(--surface)), var(--surface) 45%);
    box-shadow: var(--shadow);
  }
  .karta a.slika { display: block; border-radius: 10px; overflow: hidden; background: var(--bg-2); }
  .karta img { display: block; width: 100%; height: auto; }
  .karta__dno { display: flex; align-items: center; gap: 10px; padding: 14px 4px 4px; flex-wrap: wrap; margin-top: auto; }
  .karta__ime { flex-basis: 100%; }
  .karta__ime b { display: block; font-family: var(--serif); font-size: 19px; font-weight: 500; }
  .karta__ime span { font-size: 11.5px; color: var(--ink-mute); }
  .dugme {
    display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 15px; border-radius: 999px;
    font: 600 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; text-decoration: none; cursor: pointer;
    border: 1px solid var(--line); background: none; color: var(--ink);
  }
  .dugme svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .dugme--zlatno { background: linear-gradient(135deg, var(--brand-gold-l), var(--brand-gold)); border-color: transparent; color: #11221A; }
  .dugme:active { transform: scale(.97); }
  .dugme { flex: 1; justify-content: center; height: 42px; }

  footer { margin-top: 34px; text-align: center; font-size: 12px; line-height: 1.7; color: var(--ink-mute); }
  footer a { color: var(--gold); text-decoration: none; }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true">
  <div class="ambient__glow"></div>
  <div class="ambient__zraka"></div>
  <div class="ambient__uzorak"></div>
</div>
<main>
  <header>
    <img id="znak" src="/assets/brand/ammar_basic_logo_w_m_1.png" alt="">
    <div class="nad">Poruka dana</div>
    <h1>Grafike za objavu</h1>
    <p>Objava za feed i story za Instagram i Facebook, u zelenoj i bijeloj verziji. Slike su u punoj rezoluciji.</p>
    <div class="izbor" role="group" aria-label="Verzija">
      <button type="button" data-t="zelena" aria-pressed="true"><i style="background:#163023"></i>Zelena</button>
      <button type="button" data-t="bijela" aria-pressed="false"><i style="background:#F4EEE1"></i>Bijela</button>
    </div>
  </header>

  <div class="mreza">
    <section class="karta" data-f="objava">
      <a class="slika" target="_blank" rel="noopener"><img alt="Objava 4:5" width="900" height="1125"></a>
      <div class="karta__dno">
        <div class="karta__ime"><b>Objava</b><span>4:5 · 2160 × 2700 px</span></div>
        <button class="dugme" data-dijeli hidden type="button"><svg viewBox="0 0 24 24"><path d="M12 3v13M8 7l4-4 4 4M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Podijeli</button>
        <a class="dugme dugme--zlatno" data-preuzmi><svg viewBox="0 0 24 24"><path d="M12 3v12M7.5 11 12 15.5l4.5-4.5M5 20h14"/></svg>Preuzmi</a>
      </div>
    </section>
    <section class="karta" data-f="story">
      <a class="slika" target="_blank" rel="noopener"><img alt="Story 9:16" width="506" height="900"></a>
      <div class="karta__dno">
        <div class="karta__ime"><b>Story</b><span>9:16 · 2160 × 3840 px</span></div>
        <button class="dugme" data-dijeli hidden type="button"><svg viewBox="0 0 24 24"><path d="M12 3v13M8 7l4-4 4 4M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Podijeli</button>
        <a class="dugme dugme--zlatno" data-preuzmi><svg viewBox="0 0 24 24"><path d="M12 3v12M7.5 11 12 15.5l4.5-4.5M5 20h14"/></svg>Preuzmi</a>
      </div>
    </section>
  </div>

  <footer>
    Aplikacija: <a href="/">porukadana.ammarbasic.ba</a>
  </footer>
</main>

<script>
  /* oznaka izvoza — scripts/promo.sh je mijenja, da preglednik ne drži stare slike */
  const V = '202610132344';
  const ime = (f, t) => `poruka-dana-${f}-${t}`;
  let tema = 'zelena';
  try { tema = localStorage.getItem('pd.grafike') === 'bijela' ? 'bijela' : 'zelena'; } catch {}

  // Dijeljenje fajla ide pravo u Instagram/WhatsApp na telefonu; gdje toga
  // nema, ostaje preuzimanje.
  const moze = !!(navigator.canShare && window.File &&
    navigator.canShare({ files: [new File([''], 'a.png', { type: 'image/png' })] }));

  function crtaj() {
    document.documentElement.dataset.tema = tema === 'bijela' ? 'svijetla' : 'tamna';
    document.getElementById('znak').src = `/assets/brand/ammar_basic_logo_${tema === 'bijela' ? 'b' : 'w'}_m_1.png`;
    document.querySelectorAll('.izbor button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.t === tema)));
    document.querySelectorAll('.karta').forEach(k => {
      const n = ime(k.dataset.f, tema);
      k.querySelector('img').src = `/grafike/${n}.jpg?${V}`;
      k.querySelector('a.slika').href = `/grafike/${n}.png?${V}`;
      const p = k.querySelector('[data-preuzmi]');
      p.href = `/grafike/${n}.png?${V}`;
      p.download = `${n}.png`;
      k.querySelector('[data-dijeli]').hidden = !moze;
    });
  }

  document.querySelector('.izbor').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    tema = b.dataset.t;
    try { localStorage.setItem('pd.grafike', tema); } catch {}
    crtaj();
  });

  document.querySelectorAll('[data-dijeli]').forEach(b => b.addEventListener('click', async () => {
    const n = ime(b.closest('.karta').dataset.f, tema);
    const tekst = b.innerHTML;
    b.textContent = 'Trenutak…';
    try {
      const blob = await (await fetch(`/grafike/${n}.png?${V}`)).blob();
      await navigator.share({ files: [new File([blob], `${n}.png`, { type: 'image/png' })] });
    } catch { /* korisnik je odustao */ }
    b.innerHTML = tekst;
  }));

  crtaj();
</script>
</body>
</html>
