<!doctype html>
<html lang="bs" data-tema="tamna">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Poruka dana · izvor grafika</title>
<!--
  Izvor grafika za mreže: objava 4:5 i story 9:16, zelena i bijela. Gotove
  slike se objavljuju na /grafike; ovu stranicu čita samo scripts/promo.sh.

    /_promo/?f=objava   1080×1350
    /_promo/?f=story    1080×1920
    &t=bijela           dnevna tema aplikacije umjesto noćne

  Grafika NE crta svoj izgled: boje, slova, pozadina (ambijent i uzorak),
  znak i zlatno dugme dolaze iz /css/app.css, iz iste teme koju aplikacija
  koristi. U telefonu je prava aplikacija (iframe na „/“) u toj istoj temi.
  Kad se aplikacija promijeni, promijene se i grafike — samo ih treba ponovo
  izvesti.

  Ne objavljuje se (.vercelignore).
-->
<script>
  // tema prije prvog crtanja — kao u aplikaciji
  document.documentElement.dataset.tema =
    new URLSearchParams(location.search).get('t') === 'bijela' ? 'svijetla' : 'tamna';
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/kako.css">
<style>
  /* platno: tačna veličina objave, ostalo dolazi iz app.css (body: --bg, --ink, --sans) */
  html, body { width: 1080px; overflow: hidden; }
  body { position: relative; height: 1350px; min-height: 0; transition: none; }
  body.story { height: 1920px; }
  body > :not(.ambient) { z-index: 1; }

  /* tanak zlatni okvir s uglovima kartice iz aplikacije */
  .okvir { position: absolute; inset: 34px; pointer-events: none; border: 1px solid var(--line); }
  .ugao { position: absolute; width: 58px; height: 58px; color: var(--gold); opacity: .45; pointer-events: none; }
  .ugao svg { width: 100%; height: 100%; display: block; }
  .ugao--1 { top: 24px; left: 24px; }
  .ugao--2 { top: 24px; right: 24px; transform: scaleX(-1); }
  .ugao--3 { bottom: 24px; left: 24px; transform: scaleY(-1); }
  .ugao--4 { bottom: 24px; right: 24px; transform: scale(-1, -1); }

  /* svjetlo iza telefona — isti --glow kao ambijent aplikacije */
  .sjaj { position: absolute; border-radius: 50%; pointer-events: none;
    background: radial-gradient(closest-side, var(--glow), transparent); }

  .logo { position: absolute; height: 60px; }
  .nad {
    font-size: 15px; font-weight: 700; letter-spacing: .34em; text-transform: uppercase; color: var(--gold);
    display: flex; align-items: center; gap: 16px;
  }
  .nad::before { content: ''; width: 34px; height: 1px; background: currentColor; opacity: .7; }
  h1 {
    font-family: var(--serif); font-weight: 400; font-size: 104px; line-height: .98; letter-spacing: -.015em;
    margin: 22px 0 0; color: var(--ink);
  }
  h1 em { display: block; font-style: italic; color: var(--navod); }
  .pod { margin: 30px 0 0; font-size: 25px; line-height: 1.5; color: var(--ink-soft); text-wrap: balance; }
  .pod b { color: var(--ink); font-weight: 500; }

  /* telefon: prirodne mjere (1em = 1px), veličina i nagib kroz transform */
  .tel-drzac { position: absolute; transform-origin: top left; }
  .tel-drzac iframe { display: block; width: 402px; height: 874px; border: 0; background: var(--bg); }
  :root[data-tema="svijetla"] .kt-status { color: #000; }
  :root[data-tema="svijetla"] .kt__rub {
    box-shadow: 0 0 0 .6em rgba(0,0,0,.35), 0 3em 6em rgba(0,0,0,.18), 0 30em 70em rgba(19,39,29,.3);
  }

  /* obavijest — sistemska, u tamnom ili svijetlom izgledu telefona */
  .obav {
    position: absolute; display: flex; gap: 16px; padding: 20px 22px 22px;
    border-radius: 30px; color: #fff;
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', var(--sans), sans-serif;
    background: rgba(46, 52, 49, .74);
    -webkit-backdrop-filter: blur(26px) saturate(1.5); backdrop-filter: blur(26px) saturate(1.5);
    box-shadow: 0 30px 70px -20px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .obav img { width: 52px; height: 52px; border-radius: 12px; flex: none; }
  .obav__vrh { display: flex; justify-content: space-between; font-size: 17px; color: rgba(255,255,255,.6); }
  .obav__vrh b { color: rgba(255,255,255,.75); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; font-size: 15px; }
  .obav__nas { display: block; margin-top: 4px; font-size: 21px; font-weight: 600; }
  .obav p { margin: 3px 0 0; font-size: 20px; line-height: 1.32; color: rgba(255,255,255,.9); }
  :root[data-tema="svijetla"] .obav {
    background: rgba(255, 255, 255, .82); color: #111;
    box-shadow: 0 30px 70px -26px rgba(19,39,29,.4), 0 0 0 1px rgba(19,39,29,.06);
  }
  :root[data-tema="svijetla"] .obav__vrh { color: rgba(0,0,0,.42); }
  :root[data-tema="svijetla"] .obav__vrh b { color: rgba(0,0,0,.55); }
  :root[data-tema="svijetla"] .obav p { color: rgba(0,0,0,.84); }

  /* poziv — zlatno dugme aplikacije (.btn--zlatno), isto u obje teme */
  .poziv { position: absolute; }
  .poziv__nad { font-size: 14px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
  .poziv__nad i { font-style: normal; opacity: .6; }
  .adresa.btn {
    margin-top: 16px; padding: 20px 30px 20px 32px; border-radius: 16px; gap: 18px;
    font-size: 30px; font-weight: 600; letter-spacing: -.005em; text-transform: none;
    box-shadow: 0 18px 40px -16px var(--glow), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .adresa.btn svg { width: 26px; height: 26px; }
  .platforme { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
  .story .platforme { justify-content: center; }
  .cip {
    display: inline-flex; align-items: center; gap: 9px; height: 46px; padding: 0 18px 0 15px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
    font-size: 18px; font-weight: 500; color: var(--ink);
  }
  .cip svg { width: 20px; height: 20px; fill: currentColor; }

  /* ---------- objava 4:5 ---------- */
  .objava .logo { left: 72px; top: 70px; }
  .objava .tekst { position: absolute; left: 72px; top: 196px; width: 520px; }
  .objava .tel-drzac { left: 604px; top: 168px; transform: rotate(4deg) scale(1.06); }
  .objava .sjaj { left: 520px; top: 150px; width: 700px; height: 1100px; }
  .objava .obav { left: 60px; top: 742px; width: 560px; rotate: -2deg; }
  .objava .poziv { left: 72px; top: 1040px; }

  /* ---------- story 9:16 ---------- */
  .story .logo { left: 50%; top: 150px; translate: -50% 0; height: 62px; }
  .story .tekst { position: absolute; left: 0; right: 0; top: 276px; text-align: center; }
  .story .nad { justify-content: center; }
  .story .nad::after { content: ''; width: 34px; height: 1px; background: currentColor; opacity: .7; }
  .story h1 { font-size: 112px; }
  .story .pod { max-width: 760px; margin: 28px auto 0; }
  /* telefon cijeli, bez utapanja u pozadinu — aplikacija se vidi kakva jeste */
  .story .tel-drzac { left: 366px; top: 724px; transform: rotate(-3deg) scale(.82); }
  .story .obav { left: 104px; top: 1150px; width: 540px; rotate: -3deg; }
  .story .sjaj { left: 190px; top: 660px; width: 700px; height: 900px; }
  .story .poziv { left: 0; right: 0; top: 1490px; text-align: center; }
</style>
</head>
<body>
<!-- isti ambijent kao u aplikaciji (index.html) -->
<div class="ambient" aria-hidden="true">
  <div class="ambient__glow"></div>
  <div class="ambient__zraka"></div>
  <div class="ambient__uzorak"></div>
</div>

<div class="okvir"></div>
<i class="ugao ugao--1"></i><i class="ugao ugao--2"></i><i class="ugao ugao--3"></i><i class="ugao ugao--4"></i>
<div class="sjaj"></div>

<img class="logo" id="logo" src="/assets/brand/ammar_basic_logo_w_1.png" alt="Ammar Bašić">

<div class="tekst">
  <div class="nad">Poruka dana</div>
  <h1>Riječi koje <em>bude srce.</em></h1>
  <p class="pod">Svaki dan po jedna poruka iz knjiga <b>hafiza Ammara Bašića</b>, na tvom telefonu.</p>
</div>

<div class="tel-drzac" id="tel"></div>

<div class="obav">
  <img src="/assets/icons/apple-touch-icon.png" alt="">
  <div>
    <div class="obav__vrh"><b>Poruka dana</b><span>sada</span></div>
    <b class="obav__nas">Nova poruka dana</b>
    <p id="obav-tekst"></p>
  </div>
</div>

<div class="poziv">
  <div class="poziv__nad">Besplatno <i>·</i> PWA aplikacija</div>
  <div class="adresa btn btn--zlatno">porukadana.ammarbasic.ba
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </div>
  <div class="platforme">
    <span class="cip"><svg viewBox="0 0 24 24"><path d="M16.37 12.6c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.18-1.73-1.35-.14-2.64.8-3.33.8-.69 0-1.74-.78-2.87-.76-1.47.02-2.83.86-3.59 2.18-1.53 2.66-.39 6.6 1.1 8.76.73 1.06 1.6 2.24 2.73 2.2 1.1-.04 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.07 2.65-2.13.84-1.22 1.18-2.41 1.2-2.47-.03-.01-2.3-.88-2.32-3.5zM14.2 6.13c.6-.73 1.01-1.75.9-2.76-.87.04-1.92.58-2.54 1.31-.56.64-1.05 1.67-.92 2.66.97.08 1.96-.49 2.56-1.21z"/></svg>iPhone</span>
    <span class="cip"><svg viewBox="0 0 24 24"><path d="M17.6 9.48l1.84-3.18a.38.38 0 0 0-.66-.38l-1.86 3.22A11.4 11.4 0 0 0 12 8.1c-1.78 0-3.47.38-4.92 1.04L5.22 5.92a.38.38 0 0 0-.66.38L6.4 9.48C3.35 11.12 1.3 14.2 1 17.8h22c-.3-3.6-2.35-6.68-5.4-8.32zM7 15.25a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm10 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></svg>Android</span>
  </div>
</div>

<script type="module">
  const q = new URLSearchParams(location.search);
  const f = q.get('f') === 'story' ? 'story' : 'objava';
  const tema = document.documentElement.dataset.tema;
  document.body.classList.add(f);

  // znak u boji teme — isto kao primijeniZnakove() u aplikaciji
  document.getElementById('logo').src = `/assets/brand/ammar_basic_logo_${tema === 'svijetla' ? 'b' : 'w'}_1.png`;

  const ugao = '<svg viewBox="0 0 46 46"><g fill="none" stroke="currentColor" stroke-linecap="round"><path d="M1.6 32V11.6A10 10 0 0 1 11.6 1.6H32" stroke-width="1.3"/><path d="M8.6 34V16.4a7.8 7.8 0 0 1 7.8-7.8H34" stroke-width="1" opacity=".45"/></g></svg>';
  document.querySelectorAll('.ugao').forEach(u => { u.innerHTML = ugao; });

  /* aplikacija u telefonu: bez uvoda, u istoj temi kao grafika, tri sačuvane
     poruke — kao kod nekoga ko je koristi sedmicu dana */
  const ls = { 'pd.uvod': 3, 'pd.autoTema': false, 'pd.tema': tema, 'pd.pozdrav': true,
    'pd.sacuvano': [{ d: '2026-10-08', id: 32 }, { d: '2026-10-10', id: 8 }, { d: '2026-10-11', id: 10 }] };
  for (const [k, v] of Object.entries(ls)) localStorage.setItem(k, JSON.stringify(v));

  const tel = document.getElementById('tel');
  const dugme = (s, top, h, o) => `<i class="kt__dugme kt__dugme--ios" style="${s}:-2.6em;top:${top}em;height:${h}em;${o ? 'opacity:.7' : ''}"></i>`;
  const sig = `<svg viewBox="0 0 18 12" style="width:18em;height:12em" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>`;
  const wifi = `<svg viewBox="0 0 16 12" style="width:16em;height:12em" fill="currentColor"><path d="M8 2.2c2.4 0 4.6.9 6.3 2.5l1.3-1.4A10.8 10.8 0 0 0 8 .3 10.8 10.8 0 0 0 .4 3.3l1.3 1.4A9 9 0 0 1 8 2.2z"/><path d="M8 5.6c1.5 0 2.8.5 3.9 1.5l1.3-1.4A7.6 7.6 0 0 0 8 3.7a7.6 7.6 0 0 0-5.2 2l1.3 1.4A5.7 5.7 0 0 1 8 5.6z"/><path d="M8 9a2.3 2.3 0 0 1 1.6.6L8 11.4 6.4 9.6A2.3 2.3 0 0 1 8 9z"/></svg>`;
  const bat = `<svg viewBox="0 0 27 13" style="width:27em;height:13em" fill="none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.8" stroke="currentColor" opacity="0.4"/><rect x="2.2" y="2.2" width="14" height="8.6" rx="2.2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2z" fill="currentColor" opacity="0.45"/></svg>`;
  tel.innerHTML = `
    <div class="kt kt--ios" style="font-size:1px;width:431em;height:903em">
      ${dugme('left', 168, 34)}${dugme('left', 228, 62)}${dugme('left', 302, 62)}${dugme('right', 258, 98)}${dugme('right', 540, 74, true)}
      <div class="kt__rub" style="border-radius:68em;padding:3.5em">
        <div class="kt__okvir" style="border-radius:64.5em;padding:11em">
          <div class="kt__ekran" style="width:402em;height:874em;border-radius:54em">
            <iframe src="/" title="" scrolling="no"></iframe>
            <div class="kt-status kt-status--ios"><span class="kd-t" style="font-size:17em;font-weight:600">9:41</span>
              <span class="kt-status__ik">${sig}${wifi}${bat}</span></div>
            <i class="kt__otok"><i></i></i><i class="kt__staklo"></i>
          </div>
        </div>
      </div>
    </div>`;

  // razvojna traka i obavještenja aplikacije ne pripadaju slici; header ide
  // ispod trake statusa, kao na pravom telefonu
  const okvir = tel.querySelector('iframe');
  okvir.addEventListener('load', () => {
    const s = okvir.contentDocument.createElement('style');
    // slika je mirna: sve odmah u završnom stanju, bez prelaza teme i ulaznih animacija
    s.textContent = `*, *::before, *::after { transition: none !important;
        animation-duration: 0s !important; animation-delay: 0s !important; }
      .razvoj, .toast-hold, .nadogradnja { display: none !important; }
      .hdr { padding-top: 48px !important; } html, body { overflow: hidden !important; }`;
    okvir.contentDocument.head.appendChild(s);
  });

  // današnja poruka — ista koju telefon prikazuje
  const podaci = await (await fetch('/data/poruke.json')).json();
  const dan = Math.floor(Date.UTC(...(d => [d.getFullYear(), d.getMonth(), d.getDate()])(new Date())) / 86400000);
  const p = podaci.poruke[((dan % podaci.poruke.length) + podaci.poruke.length) % podaci.poruke.length];
  const recenica = p.tekst.match(/^.*?[.!?](\s|$)/)?.[0].trim() || p.tekst;
  document.getElementById('obav-tekst').textContent = recenica.length > 120 ? recenica.slice(0, 117) + '…' : recenica;
</script>
</body>
</html>
